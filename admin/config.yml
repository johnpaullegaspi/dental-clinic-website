backend:
  # 2026-07-29: migrated off DecapBridge/git-gateway to a direct GitHub
  # backend — Sveltia CMS does not support git-gateway at all (confirmed
  # against Sveltia's own docs), and this also drops DecapBridge's
  # pay-per-publish billing entirely. Auth now goes through GitHub directly.
  #
  # Sveltia CMS (like Decap before it) defaults to Netlify's own built-in
  # OAuth provider when no base_url is set and the site is on Netlify — no
  # extra CMS config needed. That does require a ONE-TIME manual setup step
  # that only you can do (it's your GitHub/Netlify accounts):
  #   1. GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
  #        Homepage URL: https://radiancedentalclinic.netlify.app
  #        Authorization callback URL: https://api.netlify.com/auth/done
  #      Save the Client ID, and generate + save a Client Secret.
  #   2. Netlify → this site → Project configuration → Access & security →
  #      OAuth → Install provider → GitHub → paste in the Client ID/Secret.
  # After that, logging into /admin/ shows a "Login with GitHub" button —
  # log in with a GitHub account that has write access to this repo.
  name: github
  repo: johnpaullegaspi/dental-clinic-website
  branch: main
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}>
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}>
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}>

# No local_backend/decap-server step needed anymore — Sveltia CMS has its
# own built-in "Work with Local Repository" local-testing mode (uses the
# File System Access API in Chromium browsers). Just open admin/index.html
# through a local dev server and click "Work with Local Repository" when
# prompted; no config change or extra process required. See README.md.

publish_mode: simple
media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://radiancedentalclinic.netlify.app
display_url: https://radiancedentalclinic.netlify.app

# ---------------------------------------------------------------------------
# ONE collection, ONE file (content/site.json), covering the entire site.
#
# This used to be 12 separate collections (Site Settings + 11 repeating
# sections), each mapped to its own content/*.json file. Every one of those
# was a separate "Save"/publish in the CMS — meaning updating, say, 3 services
# and 2 FAQs in the same sitting cost 2 separate commits (and on a
# pay-per-publish DecapBridge plan, 2 separate charges), even though it was
# one editing session.
#
# Now every section below (Hero, About, Contact, Social, Footer, Services,
# Dentists, Why Choose Us, Before & After, Gallery, Testimonials, Promotions,
# Insurance, Facilities, FAQs, Blog) is a field inside this ONE file entry.
# You can expand any number of sections, edit any number of fields across all
# of them, and hit "Save" once — that's one commit, one publish, regardless
# of how many sections or fields you touched.
#
# Trade-off worth knowing: this collection has no per-item editorial workflow
# or version history the way separate collections would (Decap's git-gateway
# only versions at the file level, and this is now one file for everything).
# For a small clinic site edited by one or two people, that's an easy trade
# for the cost savings; flag it if that ever stops being true.
# ---------------------------------------------------------------------------
collections:
  - name: "site_content"
    label: "Site Content"
    editor: { preview: false }
    files:
      - name: "all"
        label: "Everything (Hero, About, Services, Dentists, Gallery, etc.)"
        file: "content/site.json"
        fields:
          # -----------------------------------------------------------
          # HERO
          # -----------------------------------------------------------
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Headline (plain part)", name: "headlinePrefix", widget: "string", hint: "e.g. \"Your Smile Deserves\"" }
              - { label: "Headline (highlighted part)", name: "headlineHighlight", widget: "string", hint: "e.g. \"Exceptional Care\" — rendered in the gradient accent color" }
              - { label: "Subheadline", name: "subheadline", widget: "text" }
              - { label: "Hero Photo", name: "heroImage", widget: "image", required: false }

          # -----------------------------------------------------------
          # ABOUT
          # -----------------------------------------------------------
          - label: "About Section"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Intro Paragraph", name: "introText", widget: "text" }
              - label: "Mission"
                name: "mission"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Vision"
                name: "vision"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Values"
                name: "values"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Facilities Blurb"
                name: "facilities"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Stats / Counters"
                name: "stats"
                widget: "object"
                fields:
                  - { label: "Patients Served", name: "patientsServed", widget: "number", value_type: "int" }
                  - { label: "Years of Experience", name: "yearsExperience", widget: "number", value_type: "int" }
                  - { label: "Treatments Completed", name: "treatmentsCompleted", widget: "number", value_type: "int" }
                  - { label: "Satisfaction Rate (%)", name: "satisfactionRate", widget: "number", value_type: "int" }

          # -----------------------------------------------------------
          # CONTACT
          # -----------------------------------------------------------
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Clinic Address", name: "address", widget: "string" }
              - { label: "Phone Number", name: "phone", widget: "string" }
              - { label: "Mobile Number", name: "mobile", widget: "string" }
              - { label: "Email Address", name: "email", widget: "string" }
              - { label: "Clinic Hours", name: "hours", widget: "string" }
              - { label: "Emergency Phone", name: "emergencyPhone", widget: "string" }
              - { label: "Parking Note", name: "parkingNote", widget: "string" }
              - { label: "Google Maps Embed URL", name: "mapEmbedUrl", widget: "string", hint: "Google Maps 'Embed a map' src URL" }

          # -----------------------------------------------------------
          # SOCIAL & CHAT LINKS
          # -----------------------------------------------------------
          - label: "Social & Chat Links"
            name: "social"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "TikTok URL", name: "tiktok", widget: "string", required: false }
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
              - { label: "Messenger Link", name: "messenger", widget: "string", required: false }
              - { label: "WhatsApp Link", name: "whatsapp", widget: "string", required: false }

          # -----------------------------------------------------------
          # FOOTER
          # -----------------------------------------------------------
          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Footer Tagline", name: "tagline", widget: "text" }

          # -----------------------------------------------------------
          # SERVICES
          # -----------------------------------------------------------
          - label: "Services"
            name: "services"
            widget: "list"
            collapsed: true
            summary: "{{name}}"
            fields:
              - { label: "Icon (Font Awesome class, e.g. fa-tooth)", name: "icon", widget: "string" }
              - { label: "Service Name", name: "name", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

          # -----------------------------------------------------------
          # DENTISTS
          # -----------------------------------------------------------
          - label: "Dentists"
            name: "dentists"
            widget: "list"
            collapsed: true
            summary: "{{name}} — {{position}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Position / Title", name: "position", widget: "string" }
              - { label: "Qualifications", name: "qualifications", widget: "string" }
              - { label: "Years of Experience", name: "experienceYears", widget: "number", value_type: "int" }
              - { label: "Specializations", name: "specializations", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }

          # -----------------------------------------------------------
          # WHY CHOOSE US
          # -----------------------------------------------------------
          - label: "Why Choose Us"
            name: "whyUs"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            fields:
              - { label: "Icon (Font Awesome class)", name: "icon", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }

          # -----------------------------------------------------------
          # BEFORE & AFTER
          # -----------------------------------------------------------
          - label: "Before & After"
            name: "beforeAfter"
            widget: "list"
            collapsed: true
            summary: "{{label}}"
            fields:
              - { label: "Category", name: "category", widget: "select", options: ["veneers", "whitening", "braces", "makeover"] }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Before Photo", name: "beforeImage", widget: "image" }
              - { label: "After Photo", name: "afterImage", widget: "image" }

          # -----------------------------------------------------------
          # GALLERY
          # -----------------------------------------------------------
          - label: "Gallery"
            name: "gallery"
            widget: "list"
            collapsed: true
            summary: "{{label}}"
            fields:
              - { label: "Category", name: "category", widget: "select", options: ["interior", "procedures", "team", "patients"] }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption / Label", name: "label", widget: "string" }
              - { label: "Card Height (px)", name: "height", widget: "number", value_type: "int", default: 340, hint: "Controls the masonry tile height, e.g. 300–440" }

          # -----------------------------------------------------------
          # TESTIMONIALS
          # -----------------------------------------------------------
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            collapsed: true
            summary: "{{name}} — {{treatment}}"
            fields:
              - { label: "Patient Name", name: "name", widget: "string" }
              - { label: "Patient Photo", name: "photo", widget: "image" }
              - { label: "Rating (1–5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "Treatment Received", name: "treatment", widget: "string" }
              - { label: "Review Text", name: "review", widget: "text" }

          # -----------------------------------------------------------
          # PROMOTIONS
          # -----------------------------------------------------------
          - label: "Promotions"
            name: "promotions"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Card Color", name: "color", widget: "select", options: ["sky", "mint", "amber", "violet", "rose", "emerald"] }

          # -----------------------------------------------------------
          # INSURANCE PARTNERS
          # -----------------------------------------------------------
          - label: "Insurance Partners"
            name: "insurance"
            widget: "list"
            collapsed: true
            summary: "{{name}}"
            fields:
              - { label: "Insurance Provider Name", name: "name", widget: "string" }

          # -----------------------------------------------------------
          # CLINIC FACILITIES
          # -----------------------------------------------------------
          - label: "Clinic Facilities"
            name: "facilities"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            fields:
              - { label: "Icon (Font Awesome class)", name: "icon", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }

          # -----------------------------------------------------------
          # FAQS
          # -----------------------------------------------------------
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            collapsed: true
            summary: "{{question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

          # -----------------------------------------------------------
          # BLOG POSTS
          # -----------------------------------------------------------
          - label: "Blog Posts"
            name: "blog"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            fields:
              - { label: "Category Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Cover Image", name: "image", widget: "image" }
              # Sveltia CMS dropped the old "date" widget — its own docs (and
              # its own in-app config-error message) specify "datetime" with
              # type: date as the direct replacement for a date-only field;
              # it stores a plain ISO "YYYY-MM-DD" string by default, exactly
              # matching every existing blog post's date and what
              # js/script.js already expects — no format string needed.
              - { label: "Date", name: "date", widget: "datetime", type: "date" }
              - { label: "Read Time", name: "readTime", widget: "string", default: "4 min read" }
