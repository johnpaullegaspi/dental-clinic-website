<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Radiance Dental Studio</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS). Auth is handled by DecapBridge via the
       git-gateway backend's identity_url/gateway_url in config.yml — no Netlify
       Identity widget needed.

       Pinned to an EXACT version (no caret) — a range like "^3.0.0" resolves
       to whatever unpkg's newest matching release is at load time, with no
       build step to catch a breaking update before it ships to visitors.
       3.9.0 is confirmed working against DecapBridge's classic-auth login
       screen (verified on the sibling Aurelia project's identical setup) and
       satisfies DecapBridge's own "higher than v3.8.3" requirement.

       IMPORTANT: this script tag must stay here, at the end of <body>, not
       in <head>. Decap CMS builds its UI container via
       document.body.appendChild(...) as soon as the script runs, with no
       "wait for DOM ready" guard — if it ran before <body> existed (e.g. if
       moved into <head> with no defer/async), document.body would still be
       null and it would throw "Cannot read properties of null (reading
       'appendChild')" before anything renders. (This exact mistake happened
       on the sibling Aurelia project and took a while to track down — don't
       reintroduce it here.) -->
  <script src="https://unpkg.com/decap-cms@3.9.0/dist/decap-cms.js"></script>
</body>
</html>
