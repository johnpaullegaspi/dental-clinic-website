<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Radiance Dental Studio</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Sveltia CMS — replaces Decap CMS as of 2026-07-29. This site now
       authenticates directly against GitHub (see admin/config.yml's
       `backend:` block) instead of through DecapBridge/git-gateway, because
       Sveltia CMS does not support the git-gateway backend at all (confirmed
       against Sveltia's own docs) and this also drops DecapBridge's
       pay-per-publish billing entirely.

       Pinned to an EXACT version (no caret/latest) — same lesson learned the
       hard way on the sibling Aurelia project: an unpinned/range CDN URL
       resolves to whatever unpkg's newest release is AT LOAD TIME, with no
       build step to catch a breaking update before it ships to visitors.
       0.175.1 was confirmed to load cleanly from unpkg, and confirmed
       end-to-end against this exact config.yml (github backend + the
       consolidated single-file collection), as of 2026-07-29.

       IMPORTANT — do NOT add type="module" to this tag. Sveltia CMS is not
       currently distributed as an ES module; adding type="module" will
       silently fail to execute it.

       This script tag lives at the end of <body> (same placement Decap CMS
       needed there due to a document.body.appendChild-before-DOM-ready bug).
       Sveltia hasn't shown that same issue in testing, but there's no reason
       to risk it by moving this into <head>, so it stays here out of
       caution. -->
  <script src="https://unpkg.com/@sveltia/cms@0.175.1/dist/sveltia-cms.js"></script>
</body>
</html>
